[project]
name = "landiq-rag"
version = "0.1.0"
description = "Address-scoped RAG retrieval layer for the LandIQ platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pdfplumber>=0.11",
    "pdf2image>=1.17",
    "pytesseract>=0.3",
    "tiktoken>=0.8",
    "openai>=1.54",
    "structlog>=24.4",
    "anthropic>=0.40",
    "boto3>=1.35",
    "httpx>=0.27",
    "mangum>=0.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]
aws-cdk = [
    "aws-cdk-lib>=2.150",
    "constructs>=10.3",
]
hf = [
    "sentence-transformers>=3.0",
]
gemini = [
    "google-generativeai>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/landiq_rag"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
package = true
